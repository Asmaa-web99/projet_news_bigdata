services:

  # --- DATA LAKE (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: news_minio
    restart: unless-stopped
    networks:
      - news_network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: news_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - news_network
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb myminio/${BUCKET_BRONZE} || true &&
      mc mb myminio/${BUCKET_SILVER} || true &&
      mc mb myminio/${BUCKET_GOLD} || true &&
      exit 0;
      "

  # --- STREAMING (Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: news_zookeeper
    restart: unless-stopped
    networks:
      - news_network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: news_kafka
    restart: unless-stopped
    networks:
      - news_network
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  # --- DATA WAREHOUSE (PostgreSQL) ---
  postgres_dwh:
    image: postgres:15
    container_name: news_dwh
    restart: unless-stopped
    networks:
      - news_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data
      - ./warehouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ORCHESTRATION (Airflow) ---
  airflow_db:
    image: postgres:15
    container_name: news_airflow_db
    restart: unless-stopped
    networks:
      - news_network
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=${AIRFLOW_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- AIRFLOW INIT ---
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_airflow_init
    depends_on:
      airflow_db:
        condition: service_healthy
    networks:
      - news_network
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
      - AIRFLOW__LOGGING__LOGGING_LEVEL=${AIRFLOW__LOGGING__LOGGING_LEVEL}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    command: >
      bash -c "airflow db init &&
               airflow users create --username ${AIRFLOW_USER} --password ${AIRFLOW_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true"

  # --- AIRFLOW WEBSERVER ---
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres_dwh:
        condition: service_healthy
    networks:
      - news_network
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
      - AIRFLOW__LOGGING__LOGGING_LEVEL=${AIRFLOW__LOGGING__LOGGING_LEVEL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - DWH_HOST=${DWH_HOST}
      - DWH_PORT=${DWH_PORT}
      - DWH_DATABASE=${DWH_DATABASE}
      - DWH_USER=${DWH_USER}
      - DWH_PASSWORD=${DWH_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scrapers:/opt/airflow/scrapers
      - ./medallion:/opt/airflow/medallion
      - ./warehouse:/opt/airflow/warehouse
      - ./quality:/opt/airflow/quality
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    command: >
      bash -c "airflow dags unpause news_bigdata_pipeline 2>/dev/null || true &&
               airflow webserver --hostname 0.0.0.0"

  # --- AIRFLOW SCHEDULER ---
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres_dwh:
        condition: service_healthy
    networks:
      - news_network
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW__CORE__LOAD_EXAMPLES}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
      - AIRFLOW__LOGGING__LOGGING_LEVEL=${AIRFLOW__LOGGING__LOGGING_LEVEL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - DWH_HOST=${DWH_HOST}
      - DWH_PORT=${DWH_PORT}
      - DWH_DATABASE=${DWH_DATABASE}
      - DWH_USER=${DWH_USER}
      - DWH_PASSWORD=${DWH_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scrapers:/opt/airflow/scrapers
      - ./medallion:/opt/airflow/medallion
      - ./warehouse:/opt/airflow/warehouse
      - ./quality:/opt/airflow/quality
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    command: airflow scheduler

  # --- VISUALISATION (Streamlit) ---
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_streamlit
    restart: unless-stopped
    depends_on:
      postgres_dwh:
        condition: service_healthy
    environment:
      - DWH_HOST=${DWH_HOST}
      - DWH_PORT=${DWH_PORT}
      - DWH_DATABASE=${DWH_DATABASE}
      - DWH_USER=${DWH_USER}
      - DWH_PASSWORD=${DWH_PASSWORD}
    ports:
      - "8501:8501"
    volumes:
      - ./dashboards:/opt/airflow/dashboards
    networks:
      - news_network
    command: >
      bash -c "python -m streamlit run /opt/airflow/dashboards/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0"

volumes:
  minio_data:
  dwh_data:

networks:
  news_network:
    driver: bridge
