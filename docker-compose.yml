services:

  # --- DATA LAKE (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: news_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # --- STREAMING (Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: news_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: news_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- DATA WAREHOUSE (PostgreSQL) ---
  postgres_dwh:
    image: postgres:15
    container_name: news_dwh
    environment:
      POSTGRES_DB: news_warehouse
      POSTGRES_USER: dwh_admin
      POSTGRES_PASSWORD: dwh_password
    ports:
      - "5433:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data

  # --- ORCHESTRATION (Airflow) ---
  airflow_db:
    image: postgres:15
    container_name: news_airflow_db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_airflow
    depends_on:
      airflow_db:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
      postgres_dwh:
        condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow_db/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DWH_HOST=postgres_dwh
      - DWH_PORT=5432
      - DWH_DATABASE=news_warehouse
      - DWH_USER=dwh_admin
      - DWH_PASSWORD=dwh_password
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scrapers:/opt/airflow/scrapers
      - ./medallion:/opt/airflow/medallion
      - ./warehouse:/opt/airflow/warehouse
      - ./quality:/opt/airflow/quality
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    networks:
      - news_network
    command: >
      bash -c "sleep 15 &&
               airflow db init && 
               airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
               airflow dags unpause news_bigdata_pipeline 2>/dev/null || true &&
               (airflow scheduler & airflow webserver --bind 0.0.0.0)"

  # --- METABASE (Visualisation Pro) ---
  metabase:
    image: metabase/metabase:latest
    container_name: news_metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_HOST=postgres_dwh
      - MB_DB_PORT=5432
      - MB_DB_NAME=news_warehouse
      - MB_DB_USER=dwh_admin
      - MB_DB_PASS=dwh_password
    depends_on:
      - postgres_dwh
    networks:
      - news_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  dwh_data:

networks:
  news_network:
    driver: bridge